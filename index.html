<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Assistent</title>
<link rel="manifest" href="manifest.webmanifest">

<style>
:root{--cream:#F9F7CF;--ink:#0d0d0d;--mut:#5a5840;--mutd:#b9b78f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);font-family:'VT323',monospace}
button,input{font:inherit;border-radius:0}
button{cursor:pointer}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative}
header{padding:calc(20px + env(safe-area-inset-top)) 20px 14px;display:flex;align-items:baseline;justify-content:space-between}

.lab{font-family:'Pixelify Sans','VT323',monospace;font-size:12px;color:var(--mut);line-height:1.4}

.hero{background:var(--ink);color:var(--cream);padding:18px;display:flex;flex-direction:column;gap:12px;margin-top:16px}
.hero .lab{color:var(--mutd)}
.hero h2{margin:0;font-weight:400;font-size:42px;line-height:.92}
.hero p{margin:0;font-size:21px;line-height:1;color:var(--mutd)}
.btns{display:flex;gap:10px}
.btn{height:46px;border:2px solid var(--cream);background:transparent;color:var(--cream);font-family:'Pixelify Sans','VT323',monospace;font-weight:700;font-size:12px;flex:1}
.btn.pri{flex:2;background:var(--cream);color:var(--ink)}
.btn.big{height:52px;font-size:14px}
.btn.dark{border-color:var(--ink);color:var(--ink)}
.btn.dark.pri{background:var(--ink);color:var(--cream)}
.row{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:2px dotted var(--ink)}

.tag{flex:none;font-family:'Pixelify Sans','VT323',monospace;font-size:12px;padding:3px 6px;border:2px solid var(--ink)}
.tag.inv{background:var(--ink);color:var(--cream)}
.empty{padding:40px 0;font-size:26px;text-align:center}
.dock{background:var(--ink);padding:14px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}

.mic.on{background:var(--cream)}

.tabs{display:flex;justify-content:space-around;font-family:'Pixelify Sans','VT323',monospace;font-weight:700;font-size:12px}

.tabs button.on{color:var(--cream);border-bottom-color:var(--cream)}
.sheet{position:absolute;inset:0;background:var(--cream);z-index:10;display:flex;flex-direction:column}

.said{border:2px solid var(--ink);padding:12px;font-size:27px;line-height:1.02;overflow-wrap:anywhere}
.item{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:2px dotted var(--ink)}
.item .big{font-size:30px;line-height:1}

.field{display:flex;flex-direction:column;gap:6px}

.seg{display:flex;gap:0;margin:14px 0 4px}

.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{text-align:center;font-family:'Pixelify Sans','VT323',monospace;font-size:12px;color:var(--mut);padding-bottom:2px}
.cell{aspect-ratio:1/1.05;border:2px solid transparent;background:transparent;color:var(--ink);padding:3px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:22px;line-height:1}
.cell.out{color:var(--mutd)}
.cell.today{background:var(--ink);color:var(--cream)}
.cell.sel{border-color:var(--ink)}
.cell.today.sel{border-color:var(--mut)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}

.said.a{border-style:dotted;font-size:22px;line-height:1.1;white-space:pre-wrap}

.chips button.on{background:var(--ink);color:var(--cream)}
.chk.on{background:var(--ink)}
.lab,.btn,.tag,.seg button,.tabs,.tabs button,.dhead,.ev .tm,.rt span,.chips button,.wd,.toast,.mhead button{font-family:'VT323',monospace!important;font-weight:400!important;font-size:17px!important;letter-spacing:.02em}
.btn.big{font-size:19px!important}
.inp{width:100%;height:48px;padding:0 12px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-family:'VT323',monospace;font-size:22px}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="" id="title" aria-label="Seaded"><h1 style="font-size:38px">Assistent</h1></button>
    <span class="lab" id="stat"></span>
  </header>
  <div class="rule"></div>
  <main id="view"></main>
  <div class="dock">
    <form class="cap" id="capForm" autocomplete="off">
      <label for="capture" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Kirjuta v&#xF5;i dikteeri</label>
      <input id="capture" type="text" enterkeyhint="send" placeholder="Kirjuta v&#xF5;i dikteeri...">
      <button type="button" class="mic" id="mic" aria-label="Dikteeri">
        <svg width="24" height="30" viewBox="0 0 9 11" shape-rendering="crispEdges" aria-hidden="true"><g fill="#F9F7CF"><rect x="3" y="0" width="3" height="6"/><rect x="2" y="1" width="5" height="4"/><rect x="1" y="5" width="1" height="2"/><rect x="7" y="5" width="1" height="2"/><rect x="2" y="7" width="5" height="1"/><rect x="4" y="8" width="1" height="2"/><rect x="2" y="10" width="5" height="1"/></g></svg>
      </button>
    </form>
    <nav class="tabs" id="tabs">
      <button data-tab="today">T&#xC4;NA</button>
      <button data-tab="cal">KALENDER</button>
      <button data-tab="projects">PROJEKTID</button>
      <button data-tab="research">UURI</button>
    </nav>
  </div>
  <div id="overlay"></div>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
'use strict';
/* ===== abifunktsioonid ===== */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayStr = () => ymd(new Date());
const utc = (s) => Date.parse(s + 'T12:00:00Z');
const dayDiff = (a, b) => Math.round((utc(a) - utc(b)) / 864e5);
const addDays = (s, n) => new Date(utc(s) + n * 864e5).toISOString().slice(0, 10);
const wdOf = (s) => new Date(utc(s)).getUTCDay();
const WD = ['P', 'E', 'T', 'K', 'N', 'R', 'L'];
const MONTHS = ['jaanuar', 'veebruar', 'm\u00E4rts', 'aprill', 'mai', 'juuni', 'juuli', 'august', 'september', 'oktoober', 'november', 'detsember'];
const dm = (s) => s.slice(8, 10) + '.' + s.slice(5, 7);
const wdDm = (s) => WD[wdOf(s)] + ' ' + dm(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ===== olek ===== */
const LS = 'assistent.v1';
function seed() {
  return { cfg: { url: '', token: '' }, tasks: [], projects: [], events: [], evKey: '', evAt: 0 };
}
let S;
try { S = JSON.parse(localStorage.getItem(LS)); } catch (e) { S = null; }
if (!S || !S.tasks) S = seed();
S.events = S.events || [];
let lastErr = '';
const EMO = [['hambaarst','\u{1F9B7}'],['hammas','\u{1F9B7}'],['arst','\u{1FA7A}'],['vaktsiin','\u{1F489}'],['haigla','\u{1F3E5}'],['ravim','\u{1F48A}'],['apteek','\u{1F48A}'],['tervis','\u{1FA7A}'],['juuksur','\u2702\uFE0F'],['s\u00FCnnip\u00E4ev','\u{1F382}'],['kingitus','\u{1F381}'],['auto','\u{1F697}'],['rehv','\u{1F697}'],['\u00FClevaatus','\u{1F697}'],['tankima','\u26FD'],['kindlustus','\u{1F6E1}\uFE0F'],['maks','\u{1F4B6}'],['deklar','\u{1F4B6}'],['arve','\u{1F9FE}'],['pank','\u{1F3E6}'],['raha','\u{1F4B6}'],['makse','\u{1F4B6}'],['kruvi','\u{1F529}'],['import','\u{1F4E6}'],['tolli','\u{1F4E6}'],['spim','\u{1F4E6}'],['tellimus','\u{1F4E6}'],['pakk','\u{1F4E6}'],['eksam','\u{1F4DD}'],['kool','\u{1F4DA}'],['\u00F5pi','\u{1F4DA}'],['nba','\u{1F3C0}'],['fantasy','\u{1F3C0}'],['korv','\u{1F3C0}'],['trenn','\u{1F4AA}'],['j\u00F5usaal','\u{1F4AA}'],['jooks','\u{1F3C3}'],['sport','\u{1F3C5}'],['m\u00E4ng','\u{1F3AE}'],['osta','\u{1F6D2}'],['pood','\u{1F6D2}'],['toidupood','\u{1F6D2}'],['helista','\u{1F4DE}'],['k\u00F5ne','\u{1F4DE}'],['e-post','\u{1F4E7}'],['mail','\u{1F4E7}'],['kiri','\u{1F4E7}'],['lend','\u2708\uFE0F'],['reis','\u2708\uFE0F'],['puhkus','\u{1F3D6}\uFE0F'],['hotell','\u{1F3E8}'],['koosolek','\u{1F465}'],['kohtumine','\u{1F465}'],['\u00E4pp','\u{1F4BB}'],['kood','\u{1F4BB}'],['github','\u{1F4BB}'],['projekt','\u{1F5C2}\uFE0F'],['kass','\u{1F431}'],['koer','\u{1F436}'],['veterinaar','\u{1F43E}'],['l\u00F5una','\u{1F37D}\uFE0F'],['\u00F5htus\u00F6\u00F6k','\u{1F37D}\uFE0F'],['restoran','\u{1F37D}\uFE0F'],['s\u00F6\u00F6k','\u{1F37D}\uFE0F'],['ehita','\u{1F528}'],['remont','\u{1F527}'],['ehitus','\u{1F528}'],['koristus','\u{1F9F9}'],['pesu','\u{1F9FA}'],['kino','\u{1F3AC}'],['film','\u{1F3AC}'],['kontsert','\u{1F3B5}'],['muusika','\u{1F3B5}'],['uuri','\u{1F50E}'],['k\u00FCsi uuesti','\u23F3'],['ootan','\u23F3']];
const emo = (title) => {
  const t = String(title || '');
  if (!t || /^\p{Extended_Pictographic}/u.test(t) || t.charAt(0) === '\u25B8') return t;
  const low = t.toLowerCase();
  for (let i = 0; i < EMO.length; i++) if (low.indexOf(EMO[i][0]) >= 0) return EMO[i][1] + ' ' + t;
  return t;
};
const REPL = { daily: 'P\u00C4EV', weekly: 'N\u00C4DAL', monthly: 'KUU' };
const nextRep = (d, r) => { if (r === 'daily') return addDays(d, 1); if (r === 'weekly') return addDays(d, 7); const x = new Date(utc(d)); x.setUTCMonth(x.getUTCMonth() + 1); return x.toISOString().slice(0, 10); };
const chatOf = (t) => { try { return JSON.parse(t.chat || '[]'); } catch (e) { return []; } };
let view = 'today', cal = { mode: 'list', y: 0, m: 0, sel: '' }, pending = null, net = 'idle';
{ const n = new Date(); cal.y = n.getFullYear(); cal.m = n.getMonth(); cal.sel = todayStr(); }

function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { /* ei midagi */ } }
const configured = () => S.cfg && S.cfg.url && S.cfg.token;
const openTasks = () => S.tasks.filter((t) => !t.done && !t.deleted);

/* ===== taustaosa k\u00F5ned ===== */
async function api(action, payload) {
  const r = await fetch(S.cfg.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ token: S.cfg.token, action: action }, payload || {}))
  });
  return r.json();
}
/* ===== katkise kodeering (\u00C3\u00BC -> \u00FC) parandus ===== */
const CP1252 = { 0x20AC: 0x80, 0x201A: 0x82, 0x0192: 0x83, 0x201E: 0x84, 0x2026: 0x85, 0x2020: 0x86, 0x2021: 0x87, 0x02C6: 0x88, 0x2030: 0x89, 0x0160: 0x8A, 0x2039: 0x8B, 0x0152: 0x8C, 0x017D: 0x8E, 0x2018: 0x91, 0x2019: 0x92, 0x201C: 0x93, 0x201D: 0x94, 0x2022: 0x95, 0x2013: 0x96, 0x2014: 0x97, 0x02DC: 0x98, 0x2122: 0x99, 0x0161: 0x9A, 0x203A: 0x9B, 0x0153: 0x9C, 0x017E: 0x9E, 0x0178: 0x9F };
function fixMoji(s) {
  if (typeof s !== 'string' || !/[\xC2\xC3]/.test(s)) return s;
  const bytes = [];
  for (const ch of s) {
    const c = ch.codePointAt(0);
    if (c < 256) bytes.push(c); else if (CP1252[c] !== undefined) bytes.push(CP1252[c]); else return s;
  }
  try { return new TextDecoder('utf-8', { fatal: true }).decode(new Uint8Array(bytes)); } catch (e) { return s; }
}
function fixItem(o) { ['title', 'meta', 'waitFor', 'name', 'note', 'next', 'tag'].forEach((k) => { if (o[k]) { const f = fixMoji(o[k]); if (f !== o[k]) { o[k] = f; o.updated = Date.now(); } } }); return o; }
S.tasks = (S.tasks || []).map(fixItem); S.projects = (S.projects || []).map(fixItem);
let healed = false;
function mergeInto(local, incoming) {
  incoming = incoming.map(fixItem);
  const map = new Map(local.map((x) => [x.id, x]));
  incoming.forEach((it) => {
    const c = map.get(it.id);
    if (!c) map.set(it.id, it);
    else if (c.deleted && !it.deleted) { c.updated = Date.now(); healed = true; }
    else if (!c.deleted && it.deleted) map.set(it.id, it);
    else if (Number(it.updated) > Number(c.updated)) map.set(it.id, it);
  });
  return [...map.values()];
}
let syncTimer = null, syncing = false;
function scheduleSync() { clearTimeout(syncTimer); syncTimer = setTimeout(sync, 800); }
async function sync() {
  if (!configured()) { net = 'cfg'; stat(); return; }
  if (syncing) { scheduleSync(); return; }
  syncing = true; net = 'sync'; stat();
  try {
    const res = await api('sync', { tasks: S.tasks, projects: S.projects });
    if (!res.ok) throw new Error(res.error);
    S.tasks = mergeInto(S.tasks, res.tasks);
    S.projects = mergeInto(S.projects, res.projects);
    if (res.usage) S.usage = res.usage;
    save(); net = 'ok'; render();
    lastErr = '';
    if (healed) { healed = false; scheduleSync(); }
  } catch (e) { net = 'off'; lastErr = String((e && e.message) || e).slice(0, 140); }
  syncing = false; stat();
}
function stat() {
  const n = new Date();
  const label = { idle: '', ok: ' \u00B7 OK', sync: ' \u00B7 S\u00DCNKROON', off: ' \u00B7 OFFLINE', cfg: ' \u00B7 SEADED PUUDU' }[net] || '';
  $('#stat').textContent = WD[n.getDay()] + ' ' + pad(n.getDate()) + '.' + pad(n.getMonth() + 1) + label;
}
function changed() { save(); render(); scheduleSync(); }

/* ===== ToDo loogika ===== */
function addTask(o) {
  const now = Date.now();
  S.tasks.push({ id: uid(), title: emo(o.title), meta: o.meta || '', due: o.due || '', tag: o.tag || '', done: 0, doneAt: 0, eventId: o.eventId || '', snooze: '', created: now, updated: now, deleted: 0, waitFor: o.waitFor || '', followUp: o.followUp || '', waitEvent: o.waitEvent || '', repeat: o.repeat || '', chat: '' });
  changed();
}
function find(id) { return S.tasks.find((t) => t.id === id); }
const effDue = (t) => (t.waitFor && t.followUp ? t.followUp : t.due);
const isWaiting = (t) => !!(t.waitFor && t.followUp && t.followUp > todayStr());
function dropWaitEvent(t) { if (t.waitEvent && configured()) { const id = t.waitEvent; api('delevent', { id: id }).catch(() => {}); } t.waitEvent = ''; }
function setDone(id) {
  const t = find(id); if (!t) return; dropWaitEvent(t); t.done = 1; t.doneAt = Date.now(); t.updated = t.doneAt;
  if (t.repeat) { const td = todayStr(); let n = t.due || td; do { n = nextRep(n, t.repeat); } while (n <= td); toast('Kordub: j\u00E4rgmine ' + wdDm(n)); addTask({ title: t.title, meta: t.meta, due: n, tag: t.tag, repeat: t.repeat }); return; }
  changed();
}
function snooze(id) { const t = find(id); if (!t) return; t.snooze = todayStr(); t.updated = Date.now(); changed(); }
function rank(t) {
  const td = todayStr();
  let r;
  const ed = effDue(t);
  if (ed) { const d = dayDiff(ed, td); r = d < 0 ? 0 + (1 - 1 / (1 - d)) * 0.5 : d <= 7 ? 1 + d / 10 : 2 + Math.min(d, 365) / 400; }
  else r = 3 + (t.created % 1000) / 1e6;
  if (t.snooze === td) r += 10;
  return r;
}
function sorted() { return openTasks().filter((t) => !isWaiting(t) && (!S.filter || t.tag === S.filter)).sort((a, b) => rank(a) - rank(b) || a.created - b.created); }
function tagOf(t) {
  if (t.waitFor && t.followUp) return t.followUp <= todayStr() ? { txt: 'K\u00DCSI UUESTI', inv: true } : { txt: 'J\u00C4TK ' + dm(t.followUp), inv: false };
  if (t.due) {
    const d = dayDiff(t.due, todayStr());
    if (d < 0) return { txt: 'M\u00D6\u00D6DAS', inv: true };
    if (d === 0) return { txt: 'T\u00C4NA', inv: true };
    if (d === 1) return { txt: 'HOMME', inv: false };
    if (d <= 7) return { txt: d + ' P\u00C4EVA', inv: false };

const closeOverlay = () => { $('#overlay').innerHTML = ''; pending = null; };

async function confirmPending(btn) {
  if (!pending) return;
  btn.disabled = true; btn.textContent = '...';
  let ids = [];
  const keepEv = pending.events.filter((e) => !e.skip && !(e.follow && pending.tasks[e.ti] && pending.tasks[e.ti].skip));
  const keepTk = pending.tasks.filter((t) => !t.skip);
  try {
    if (keepEv.length) {
      const r = await api('commit', { events: keepEv });
      if (!r.ok) throw new Error(r.error);
      ids = r.ids || [];
    }
  } catch (e) {
    toast('Kalendrisse ei saanud: ' + e.message, 7000); btn.disabled = false; btn.textContent = 'KINNITA';
    if (!$('#overlay').innerHTML) showConfirm(pending.text, { events: pending.events.filter((x) => !x.follow), tasks: pending.tasks, note: pending.note });
    return;
  }
  const normal = keepEv.filter((e) => !e.follow).length;
  const withEv = normal === 1 && keepTk.filter((t) => !t.waitFor).length >= 1;
  let fi = normal;
  keepTk.forEach((t) => {
    const w = t.waitFor && t.followUp;
    addTask({ title: t.title, meta: t.note, tag: t.tag, repeat: w ? '' : t.repeat, due: w ? '' : t.due, eventId: !w && withEv ? ids[0] : '', waitFor: w ? t.waitFor : '', followUp: w ? t.followUp : '', waitEvent: w ? ids[fi++] || '' : '' });
  });
  const nEv = normal, nTd = keepTk.length;
  $('#capture').value = '';
  closeOverlay();
  S.evAt = 0; loadEvents(true);
  toast('Salvestatud: kalendrisse ' + nEv + ', ToDo-sse ' + nTd);
}

async function submit() {
  const inp = $('#capture'), text = inp.value.trim();
  if (!text) return;
  const pu = projUpdate(text);
  if (pu) { inp.value = ''; toast('Projekt uuendatud: ' + pu.name); return; }
  if (!configured()) { addTask({ title: text }); inp.value = ''; toast('Lisatud ToDo-sse (seaded puudu, AI-d ei kasutatud)'); return; }
  inp.disabled = true; inp.placeholder = 'Loen \u00E4ra...';
  try {
    const res = await api('parse', { text: text, today: todayStr() });
    if (!res.ok) throw new Error(res.error);
    const any = (res.events || []).length || (res.tasks || []).length;
    showConfirm(text, res, !!(S.cfg.auto && any));
    if (S.cfg.auto && any) await confirmPending({ disabled: false, textContent: '' });
  } catch (e) {
    const lp = localParse(text), why = String((e && e.message) || e).slice(0, 120);
    if (lp) { lp.note = 'AI ei vastanud (' + why + '). Lugesin ise, vaata \u00FCle.'; showConfirm(text, lp); }
    else { addTask({ title: text }); inp.value = ''; toast('AI ei vastanud (' + why + '). Lisasin tavalise ToDo-na', 7000); }
  }
  inp.disabled = false; inp.placeholder = 'Kirjuta v\u00F5i dikteeri...';
}

async function emojiAll() {

    const t0 = todayStr(), er = await api('events', { from: addDays(t0, -30), to: addDays(t0, 90) });
    if (!er.ok) throw new Error(er.error);
    const noEmo = (s) => !/^\p{Extended_Pictographic}/u.test(String(s || '')) && String(s || '').charAt(0) !== '\u25B8';
    const items = [];
    S.tasks.filter((t) => !t.deleted && !t.done && noEmo(t.title)).forEach((t) => items.push({ k: 't', ref: t, title: t.title }));
    er.events.filter((e) => noEmo(e.title)).forEach((e) => items.push({ k: 'e', ref: e, title: e.title }));
    items.forEach((it) => { const n = emo(it.title); it.emo = n !== it.title ? n.slice(0, n.length - it.title.length - 1) : ''; });
    const miss = items.filter((it) => !it.emo);
    for (let i = 0; i < miss.length; i += 60) {
      const ch = miss.slice(i, i + 60), r = await api('emojis', { titles: ch.map((c) => c.title) });
      if (r.ok) ch.forEach((c, j) => { c.emo = r.emojis[j] || ''; });

    });

    S.evAt = 0; changed(); loadEvents(true);

    '<div class="field"><label class="lab" for="ct">TOKEN (SAMA, MIS APP_TOKEN)</label><input id="ct" type="text" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" value="' + esc(S.cfg.token) + '"></div>' +
    '<label class="lab" style="display:flex;gap:10px;align-items:center;color:var(--ink)"><input id="ca" type="checkbox" style="width:22px;height:22px"' + (S.cfg.auto ? ' checked' : '') + '> SALVESTA KOHE, ILMA KINNITUSEATA</label>' +
    '<div class="field"><label class="lab" for="ci">IMPORDI ANDMED (JSON, valikuline)</label><textarea id="ci" rows="3" style="border:2px solid var(--ink);background:transparent;color:var(--ink);font-family:VT323,monospace;font-size:18px;padding:8px"></textarea><button class="btn dark" data-act="import" style="flex:none;width:100%">IMPORDI</button></div>' +
    '<div class="btns"><button class="btn dark" data-act="export">EKSPORDI JSON</button><button class="btn dark" data-act="emojiall">LISA EMOJID</button></div>' +
    '<div class="btns"><button class="btn big dark pri" data-act="savecfg">SALVESTA</button><button class="btn big dark" data-act="syncnow" style="flex:1">S\u00DCNK</button></div>' +
    '<div class="lab">Andmed on selles seadmes ja s\u00FCnkroonitakse Google Sheetsiga. Token ja aadress j\u00E4\u00E4vad ainult sellesse brauserisse.</div></div></div>';
}

/* ===== s\u00FCndmused ===== */
let toastT = null;
function toast(msg, ms) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), ms || 3200); }

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act],[data-tab]');
  if (!el) return;
  if (el.dataset.tab) { view = el.dataset.tab; render(); if (view === 'cal') loadEvents(); return; }
  const a = el.dataset.act;
  if (a === 'done') { closeOverlay(); setDone(el.dataset.id); }
  else if (a === 'snooze') { closeOverlay(); snooze(el.dataset.id); }
  else if (a === 'task') showTask(el.dataset.id);
  else if (a === 'waitform') showWait(el.dataset.id);
  else if (a === 'wdays') { waitDays = Number(el.dataset.n); document.querySelectorAll('[data-act=wdays]').forEach((b) => b.classList.toggle('on', b === el)); }
  else if (a === 'waitsave') saveWait(el.dataset.id);
  else if (a === 'del') { const t = find(el.dataset.id); if (t) { dropWaitEvent(t); t.deleted = 1; t.updated = Date.now(); } closeOverlay(); changed(); }
  else if (a === 'cmode') { cal.mode = el.dataset.v; render(); loadEvents(); }
  else if (a === 'mprev') { cal.m--; if (cal.m < 0) { cal.m = 11; cal.y--; } render(); loadEvents(); }
  else if (a === 'mnext') { cal.m++; if (cal.m > 11) { cal.m = 0; cal.y++; } render(); loadEvents(); }
  else if (a === 'csel') { cal.sel = el.dataset.d; render(); }
  else if (a === 'proj') showProj(el.dataset.id);
  else if (a === 'projnew') showProj('');
  else if (a === 'ptoday') $('#pd').value = todayStr();
  else if (a === 'projsave') saveProj(el.dataset.id);
  else if (a === 'projdel') { const p = S.projects.find((x) => x.id === el.dataset.id); if (p) { p.deleted = 1; p.updated = Date.now(); } closeOverlay(); changed(); }
  else if (a === 'confirm') confirmPending(el);
  else if (a === 'tog') { const k = el.dataset.k, i = Number(k.slice(1)), it = k[0] === 'e' ? pending.events[i] : pending.tasks[i]; if (it) it.skip = !it.skip; renderConfirm(); }
  else if (a === 'flt') { S.filter = el.dataset.v; save(); render(); }
  else if (a === 'rep') { editRep = el.dataset.v; document.querySelectorAll('[data-act=rep]').forEach((b) => b.classList.toggle('on', b === el)); }
  else if (a === 'dclear') $('#td').value = '';
  else if (a === 'tasksave') saveTask(el.dataset.id);
  else if (a === 'res') showRes(el.dataset.id);
  else if (a === 'break') doBreak(el.dataset.id);
  else if (a === 'bfirst') { const t = find(brk.id); addTask({ title: '5 min: ' + brk.steps[0], due: todayStr(), tag: t ? t.tag : '' }); if (t) { t.snooze = todayStr(); t.updated = Date.now(); } closeOverlay(); changed(); toast('Esimene samm on t\u00E4na nimekirja eesotsas'); }
  else if (a === 'ball') { const t = find(brk.id); brk.steps.forEach((x, i) => addTask({ title: (t ? t.title + ': ' : '') + x, due: i === 0 ? todayStr() : '', tag: t ? t.tag : '' })); if (t) { t.snooze = todayStr(); t.updated = Date.now(); } closeOverlay(); changed(); toast('Lisatud ' + brk.steps.length + ' sammu'); }
  else if (a === 'stale') showStale();
  else if (a === 'ev') showEvent(el.dataset.id);
  else if (a === 'evsave') saveEvent(el.dataset.id);
  else if (a === 'evdel') delEvent(el.dataset.id);
  else if (a === 'export') { const b = new Blob([JSON.stringify({ tasks: S.tasks, projects: S.projects }, null, 1)], { type: 'application/json' }), l = document.createElement('a'); l.href = URL.createObjectURL(b); l.download = 'assistent-' + todayStr() + '.json'; document.body.appendChild(l); l.click(); l.remove(); toast('Varukoopia alla laetud'); }
  else if (a === 'emojiall') { closeOverlay(); emojiAll(); }
  else if (a === 'edit') closeOverlay();
  else if (a === 'plain') { const t = pending.text; addTask({ title: t }); $('#capture').value = ''; closeOverlay(); }
  else if (a === 'close') closeOverlay();
  else if (a === 'import') { try { const j = JSON.parse($('#ci').value); S.tasks = mergeInto(S.tasks, j.tasks || []); S.projects = mergeInto(S.projects, j.projects || []); closeOverlay(); changed(); toast('Imporditud: ' + (j.tasks || []).length + ' ToDo-d, ' + (j.projects || []).length + ' projekti'); } catch (e) { toast('JSON ei sobi'); } }
  else if (a === 'savecfg') { S.cfg = { url: $('#cu').value.trim(), token: $('#ct').value.trim(), auto: $('#ca').checked }; save(); closeOverlay(); toast('Seaded salvestatud (token ' + S.cfg.token.length + ' m\u00E4rki)'); sync(); }
  else if (a === 'syncnow') { S.cfg = { url: $('#cu').value.trim(), token: $('#ct').value.trim(), auto: $('#ca').checked }; save(); closeOverlay(); sync(); }
});
$('#title').addEventListener('click', showSettings);
document.addEventListener('submit', (e) => {
  if (e.target.id === 'rForm') { e.preventDefault(); sendRes(e.target.dataset.id); }
  else if (e.target.id === 'gmForm') { e.preventDefault(); gmailSearch(); }
});
$('#capForm').addEventListener('submit', (e) => { e.preventDefault(); submit(); });
$('#mic').addEventListener('click', () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition, inp = $('#capture'), mic = $('#mic');
  if (!SR) { inp.focus(); toast('Vajuta klaviatuuril mikrofoni'); return; }
  const r = new SR(); r.lang = 'et-EE'; r.interimResults = false;
  r.onstart = () => mic.classList.add('on');
  r.onend = () => mic.classList.remove('on');
  r.onresult = (e) => { inp.value = (inp.value ? inp.value + ' ' : '') + e.results[0][0].transcript; };
  r.onerror = () => { inp.focus(); toast('H\u00E4\u00E4l ei t\u00F6\u00F6tanud, kasuta klaviatuuri mikrofoni'); };
  try { r.start(); } catch (e) { inp.focus(); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { sync(); if (view === 'cal') loadEvents(); render(); } });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
if (configured()) sync(); else { net = 'cfg'; stat(); }
</script>
</body>
</html>
